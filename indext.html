<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>I Love You</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <canvas id="canvas"></canvas>

    <div class="love">Sorry Babe I love you</div>


    <script>

        const canvas = document.getElementById("canvas");
        const ctx = canvas.getContext("2d");

        let W;
        let H;

        let particles = [];

        let time = 0;
        let startTime = performance.now();


        // ==========================================
        // CANVAS SIZE
        // ==========================================

        function resize() {

            const dpr = window.devicePixelRatio || 1;

            W = window.innerWidth;
            H = window.innerHeight;

            canvas.width = W * dpr;
            canvas.height = H * dpr;

            canvas.style.width = W + "px";
            canvas.style.height = H + "px";

            ctx.setTransform(
                dpr,
                0,
                0,
                dpr,
                0,
                0
            );

            createParticles();
        }


        window.addEventListener(
            "resize",
            resize
        );


        // ==========================================
        // HEART EQUATION
        // ==========================================

        function heart(t) {

            const x =
                16 * Math.pow(
                    Math.sin(t),
                    3
                );

            const y =
                13 * Math.cos(t)
                - 5 * Math.cos(2 * t)
                - 2 * Math.cos(3 * t)
                - Math.cos(4 * t);

            return {
                x: x,
                y: y
            };
        }


        // ==========================================
        // CREATE HEART PARTICLES
        // ==========================================

        function createParticles() {

            particles = [];

            const scale =
                Math.min(W, H) * 0.014;

            const amount = 1600;


            for (
                let i = 0;
                i < amount;
                i++
            ) {

                // Random position on heart
                const t =
                    Math.random() *
                    Math.PI * 2;


                const point =
                    heart(t);


                // Give heart some thickness
                const thickness =
                    Math.pow(
                        Math.random(),
                        2.5
                    ) * 2.3;


                const angle =
                    Math.random() *
                    Math.PI * 2;


                const targetX =
                    point.x * scale
                    +
                    Math.cos(angle)
                    *
                    thickness
                    *
                    scale;


                const targetY =
                    -point.y * scale
                    +
                    Math.sin(angle)
                    *
                    thickness
                    *
                    scale;


                // Starting position
                // particles come from outside
                const startAngle =
                    Math.random()
                    *
                    Math.PI
                    * 2;


                const startDistance =
                    Math.max(W, H)
                    *
                    (
                        0.35
                        +
                        Math.random()
                        * 0.6
                    );


                const startX =
                    Math.cos(startAngle)
                    *
                    startDistance;


                const startY =
                    Math.sin(startAngle)
                    *
                    startDistance;


                particles.push({

                    x: startX,

                    y: startY,

                    targetX: targetX,

                    targetY: targetY,

                    size:
                        Math.random()
                        * 2.2
                        + 0.4,

                    alpha:
                        Math.random()
                        * 0.8
                        + 0.2,

                    phase:
                        Math.random()
                        *
                        Math.PI
                        * 2,

                    speed:
                        Math.random()
                        * 0.8
                        + 0.4,

                    delay:
                        Math.random()
                        * 1.2
                });
            }
        }


        // ==========================================
        // EASING
        // ==========================================

        function easeOut(t) {

            return 1 -
                Math.pow(
                    1 - t,
                    4
                );
        }


        // ==========================================
        // ANIMATION
        // ==========================================

        function animate(now) {

            requestAnimationFrame(
                animate
            );


            time += 0.015;


            // --------------------------------------
            // BLACK BACKGROUND
            // --------------------------------------

            ctx.fillStyle =
                "rgba(0, 0, 0, 0.28)";


            ctx.fillRect(
                0,
                0,
                W,
                H
            );


            ctx.save();


            // --------------------------------------
            // CENTER HEART
            // --------------------------------------

            ctx.translate(
                W / 2,
                H / 2
            );


            // --------------------------------------
            // HEARTBEAT
            // --------------------------------------

            const heartbeat =
                Math.sin(
                    time * 2.4
                );


            let pulse = 1;


            if (heartbeat > 0.75) {

                pulse =
                    1
                    +
                    (
                        heartbeat
                        - 0.75
                    )
                    * 0.08;
            }


            // --------------------------------------
            // FORMING ANIMATION
            // --------------------------------------

            const elapsed =
                (
                    now -
                    startTime
                ) / 1000;


            // --------------------------------------
            // PARTICLES
            // --------------------------------------

            for (
                const p of particles
            ) {


                // Particle formation progress
                let progress =
                    Math.max(
                        0,
                        Math.min(
                            1,
                            (
                                elapsed
                                -
                                p.delay
                            )
                            /
                            2.0
                        )
                    );


                progress =
                    easeOut(
                        progress
                    );


                // Move particle
                // from outside -> heart
                let baseX =
                    p.x
                    +
                    (
                        p.targetX
                        -
                        p.x
                    )
                    *
                    progress;


                let baseY =
                    p.y
                    +
                    (
                        p.targetY
                        -
                        p.y
                    )
                    *
                    progress;


                // ----------------------------------
                // FLOATING MOVEMENT
                // ----------------------------------

                const movement =
                    Math.sin(
                        time
                        *
                        p.speed
                        +
                        p.phase
                    );


                const floatX =
                    Math.cos(
                        p.phase
                        +
                        time * 0.7
                    )
                    *
                    movement
                    *
                    1.5;


                const floatY =
                    Math.sin(
                        p.phase
                        +
                        time * 0.7
                    )
                    *
                    movement
                    *
                    1.5;


                // ----------------------------------
                // HEART PULSE
                // ----------------------------------

                const x =
                    baseX
                    *
                    pulse
                    +
                    floatX;


                const y =
                    baseY
                    *
                    pulse
                    +
                    floatY;


                // ----------------------------------
                // SPARKLE
                // ----------------------------------

                const sparkle =
                    0.55
                    +
                    Math.sin(
                        time * 4
                        +
                        p.phase
                    )
                    * 0.45;


                const alpha =
                    p.alpha
                    *
                    sparkle
                    *
                    Math.min(
                        1,
                        progress * 2
                    );


                // ----------------------------------
                // DRAW PARTICLE
                // ----------------------------------

                ctx.beginPath();


                ctx.arc(
                    x,
                    y,
                    p.size,
                    0,
                    Math.PI * 2
                );


                const green =
                    65
                    +
                    Math.random()
                    * 50;


                const blue =
                    145
                    +
                    Math.random()
                    * 80;


                ctx.fillStyle =
                    `rgba(
                        255,
                        ${green},
                        ${blue},
                        ${alpha}
                    )`;


                // Pink glow
                ctx.shadowBlur = 8;


                ctx.shadowColor =
                    "rgba(255, 40, 150, 0.9)";


                ctx.fill();
            }


            ctx.restore();
        }


        // ==========================================
        // START
        // ==========================================

        resize();

        requestAnimationFrame(
            animate
        );

    </script>

</body>
</html>
